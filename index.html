<!doctype html>
<html lang="tr">
  <head>
    <meta name="theme-color" content="#071a3d" />

    <title>S&S CUP Manager Pro</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var page = params.get("page");
          var access = params.get("access");
          var token = "eXSxKuVhbf2AErK1Q5lGbeve4ioCOSGRT--iQ6MjObk";
          var authorized = localStorage.getItem("sscup-mobile-admin-authorized") === "1";
          var adminRequest = (page === "yonetim" || page === "admin") && (access === token || authorized);
          var manifestHref = adminRequest ? "./manifest-admin.webmanifest" : "./manifest.webmanifest";
          var link = document.createElement("link");
          link.rel = "manifest";
          link.href = manifestHref;
          document.head.appendChild(link);
        } catch (e) {
          var fallback = document.createElement("link");
          fallback.rel = "manifest";
          fallback.href = "./manifest.webmanifest";
          document.head.appendChild(fallback);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
