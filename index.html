<!doctype html>
<html lang="tr">
  <head>
    <meta name="theme-color" content="#071a3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S&S CUP Manager Pro</title>
    <script>
      (function () {
        var link = document.createElement("link");
        link.rel = "manifest";
        try {
          var params = new URLSearchParams(window.location.search);
          var isAdmin = (params.get("page") === "yonetim" || params.get("page") === "admin")
            && params.get("access") === "SSCUP-YONETIM-2026-7pQ4mN9xK2vR8sT5";
          link.href = isAdmin ? "./manifest-admin.webmanifest" : "./manifest.webmanifest";
        } catch (e) {
          link.href = "./manifest.webmanifest";
        }
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
